<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#111111"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#9A9A9A"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="64" y="58" font-size="28" font-weight="700" fill="#111111" letter-spacing="-0.5">TRACE — AWS Cloud Architecture</text>
  <text x="64" y="86" font-size="14" fill="#6B6B6B">Lost &amp; found platform · Serverless · Human-verified returns · Append-only audit trail</text>
  <line x1="64" y1="104" x2="1536" y2="104" stroke="#E5E5E5" stroke-width="1"/>

  <!-- ===== ROW 1: Clients ===== -->
  <rect x="620" y="128" width="360" height="64" rx="4" fill="#111111"/>
  <text x="800" y="156" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">End Users</text>
  <text x="800" y="176" text-anchor="middle" font-size="12" fill="#B0B0B0">Web browsers · Mobile devices</text>

