  <!-- 2 Users -> Cognito -->
  <path d="M980 160 L1330 160 L1330 260" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="1160" cy="160" r="12" fill="#111111"/>
  <text x="1160" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text>
  <text x="1344" y="200" font-size="10" fill="#6B6B6B">sign-in · JWT</text>

  <!-- 3 CloudFront/SPA -> API GW -->
  <path d="M590 324 L590 420" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="590" cy="372" r="12" fill="#111111"/>
  <text x="590" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text>
  <text x="606" y="360" font-size="10" fill="#6B6B6B">HTTPS + JWT</text>

  <!-- Cognito -> API GW (authz note) -->
  <path d="M1180 300 L1080 300 L1080 452 L920 452" fill="none" stroke="#9A9A9A" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#arrowGray)"/>
  <text x="1092" y="340" font-size="10" fill="#9A9A9A">authorizer</text>

