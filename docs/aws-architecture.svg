  <text x="1010" y="930" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">SSM Parameter Store</text>
  <text x="1010" y="950" text-anchor="middle" font-size="11" fill="#6B6B6B">Feature flags · config</text>

