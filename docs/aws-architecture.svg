  <text x="444" y="588" font-size="13" font-weight="600" fill="#111111">Claims Fn</text>
  <text x="444" y="606" font-size="11" fill="#6B6B6B">Private Q&amp;A · status</text>

  <rect x="640" y="560" width="220" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="656" y="576" width="32" height="32" rx="4" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
  <text x="672" y="597" text-anchor="middle" font-size="9" font-weight="700" fill="#111111">λ</text>
  <text x="704" y="588" font-size="13" font-weight="600" fill="#111111">Handoff Fn</text>
  <text x="704" y="606" font-size="11" fill="#6B6B6B">Admin-only · mark returned</text>

  <rect x="900" y="560" width="220" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="916" y="576" width="32" height="32" rx="4" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
