  <text x="224" y="306" font-size="11" fill="#6B6B6B">DNS · TLS (ACM)</text>

  <!-- CloudFront + WAF -->
  <rect x="440" y="260" width="300" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="456" y="276" width="32" height="32" rx="4" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
  <text x="472" y="297" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">CF</text>
  <text x="504" y="288" font-size="14" font-weight="600" fill="#111111">CloudFront + WAF</text>
  <text x="504" y="306" font-size="11" fill="#6B6B6B">CDN · edge TLS · rate limits</text>

  <!-- S3 SPA -->
  <rect x="800" y="260" width="260" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
