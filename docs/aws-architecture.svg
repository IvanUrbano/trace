  <!-- 6 EventBridge -> Match Lambda -->
  <path d="M1330 624 L1330 656 L1180 656 L1180 720" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="1330" cy="640" r="12" fill="#111111"/>
  <text x="1330" y="644" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">6</text>

