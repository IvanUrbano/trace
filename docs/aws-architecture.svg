  <rect x="590" y="1018" width="28" height="16" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="630" y="1030" font-size="12" fill="#6B6B6B">Advisory AI (no auto-approval)</text>

  <text x="64" y="1064" font-size="11" fill="#9A9A9A">Flows: 1 DNS/CDN · 2 Auth · 3 API+JWT · 4 Dispatch · 5 Persist · 6 Async match ranking · 7 Notifications · 8 Observability</text>
  <text x="64" y="1084" font-size="11" font-weight="600" fill="#111111">Security: private media bucket · Cognito admin-only handoffs · audit table append-only · public GET strips private identifying details</text>
