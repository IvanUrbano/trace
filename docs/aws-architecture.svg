  <rect x="1200" y="560" width="260" height="64" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5"/>
  <rect x="1216" y="576" width="32" height="32" rx="4" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
