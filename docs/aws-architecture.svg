  <text x="832" y="297" text-anchor="middle" font-size="10" font-weight="700" fill="#111111">S3</text>
  <text x="864" y="288" font-size="14" font-weight="600" fill="#111111">S3 — React SPA</text>
  <text x="864" y="306" font-size="11" fill="#6B6B6B">Static build · versioned</text>

