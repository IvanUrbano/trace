  <text x="556" y="796" font-size="11" fill="#6B6B6B">Uploads via presigned URLs only</text>

  <!-- Match Lambda -->
  <rect x="880" y="720" width="300" height="88" rx="4" fill="#FFFFFF" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 3"/>
  <rect x="896" y="740" width="32" height="32" rx="4" fill="#F5F5F5" stroke="#111111" stroke-width="1"/>
  <text x="912" y="761" text-anchor="middle" font-size="9" font-weight="700" fill="#111111">λ</text>
  <text x="944" y="752" font-size="14" font-weight="600" fill="#111111">Match Ranking Lambda</text>
  <text x="944" y="772" font-size="11" fill="#6B6B6B">Rank candidates (description · category · date · location)</text>
  <text x="896" y="796" font-size="11" font-weight="600" fill="#111111">Output = illustrative scores only — never auto-approves</text>

