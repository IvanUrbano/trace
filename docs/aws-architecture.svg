  <!-- ===== Legend ===== -->
  <line x1="64" y1="1000" x2="1536" y2="1000" stroke="#E5E5E5" stroke-width="1"/>
  <text x="64" y="1030" font-size="12" font-weight="600" fill="#111111">Legend</text>
